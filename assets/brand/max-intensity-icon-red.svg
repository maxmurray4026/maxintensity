<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Max Intensity app icon: the arm mark in brand red (#FF2B2B) on black (#050505). The mark is the embedded logo, re-inked red. -->
  <defs>
    <clipPath id="ring"><circle cx="512" cy="512" r="392"/></clipPath>
    <filter id="redink" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
      <feComponentTransfer><feFuncR type="table" tableValues="1 0.02"/><feFuncG type="table" tableValues="0.17 0.02"/><feFuncB type="table" tableValues="0.17 0.02"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#050505"/>
  <g clip-path="url(#ring)">
    <image xlink:href="data:image/jpeg;base64," x="120" y="120" width="784" height="784" preserveAspectRatio="xMidYMid slice" filter="url(#redink)"/>
  </g>
  <circle cx="512" cy="512" r="392" fill="none" stroke="#FF2B2B" stroke-width="14"/>
</svg>
