<div id="errbox" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;font-family:monospace;font-size:12px;padding:12px;z-index:9999;word-break:break-word"></div>
<script>
function showErr(msg){ var b=document.getElementById("errbox"); b.style.display="block"; b.textContent="Error: "+msg; }
window.onerror = function(msg, s, line){ showErr(msg + " (line " + line + ")"); };
window.addEventListener("unhandledrejection", function(e){ showErr(e.reason && e.reason.message ? e.reason.message : String(e.reason)); });

window.storage = {
  get: function(k){ return new Promise(function(res, rej){ var v=localStorage.getItem("mi:"+k); if(v===null){ rej(new Error("not found")); } else { res({key:k, value:v}); } }); },
  set: function(k,v){ return new Promise(function(res){ localStorage.setItem("mi:"+k, v); res({key:k, value:v}); }); },
  "delete": function(k){ return new Promise(function(res){ localStorage.removeItem("mi:"+k); res({key:k, deleted:true}); }); },
  list: function(){ return new Promise(function(res){ var keys=[]; for(var i=0;i<localStorage.length;i++){ var key=localStorage.key(i); if(key&&key.indexOf("mi:")===0) keys.push(key.slice(3)); } res({keys:keys}); }); }
};

var _fetch = window.fetch.bind(window);
window.fetch = function(url, opts){
  opts = opts || {};
  if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
    var key = localStorage.getItem("mi-key") || "";
    if (!key) {
      key = (window.prompt("Paste your Anthropic API key to power the AI features (stored only on this device):") || "").trim();
      if (key) localStorage.setItem("mi-key", key);
    }
    var h = opts.headers || {};
    h["x-api-key"] = key;
    h["anthropic-version"] = "2023-06-01";
    h["anthropic-dangerous-direct-browser-access"] = "true";
    opts.headers = h;
  }
  return _fetch(url, opts);
};
</script>

// ---------- Nutrition calculator (doc formulas) ----------
const ACTIVITY = [
  { label: "Sedentary", mult: 13.5 },
  { label: "Lightly active", mult: 15.5 },
  { label: "Fairly active", mult: 17.5 },
  { label: "Very active", mult: 20.5 },
];
const GOALS = [
  { label: "Lose weight", delta: -400 },
  { label: "Maintain", delta: 0 },
  { label: "Gain muscle", delta: 400 },
];
function calcTargets(kg, activityIdx, goalIdx) {
  const lbs = kg * 2.2046;
  const kcal = Math.round(lbs * ACTIVITY[activityIdx].mult + GOALS[goalIdx].delta);
  const protein = Math.round(lbs * 0.82);
  const fat = Math.round(lbs * 0.45);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { kcal, protein, carbs, fat };
}

  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }

}
async function saveKey(key, value) {
  try { await window.storage.set(key, JSON.stringify(value)); } catch (e) { console.error(e); }

// ---------- Units ----------
const KG_LB = 2.2046;
const dispW = (kg, unit) => { const n = Number(kg); if (!n && n !== 0) return ""; return unit === "lb" ? String(Math.round(n * KG_LB * 10) / 10) : String(Math.round(n * 10) / 10); };
const storeW = (val, unit) => { const n = Number(val); if (!n && n !== 0) return ""; return unit === "lb" ? String(Math.round((n / KG_LB) * 100) / 100) : String(n); };

// ---------- Split bias: reorder + reinforce priority muscles ----------
function applySplit(prog, split) {
  const pr = structuredClone(prog);
  const has = (exs, keys) => exs.some((e) => keys.some((k) => e.name.toLowerCase().includes(k)));
  const moveFirst = (exs, keys) => {
    const hit = [], rest = [];
    exs.forEach((e) => (keys.some((k) => e.name.toLowerCase().includes(k)) ? hit : rest).push(e));
    return [...hit, ...rest];
  };
  const mk = (name, note) => ({ name, scheme: [10, 6, 6, 6], note: note || "", tempo: "4-3-2-1", rest: "2\u20133 min" });
  const isUpper = (d) => d.name.toLowerCase().includes("upper");
  const isLegs = (d) => d.name.toLowerCase().includes("leg");

  if (split === "legglute") {
    pr.days.forEach((d) => {
      if (isLegs(d)) {
        if (!has(d.exercises, ["hip thrust", "glute"])) d.exercises.unshift(mk("Hip Thrust", "priority \u2014 drive through heels"));
        d.exercises = moveFirst(d.exercises, ["hip thrust", "glute", "leg press"]);
      }
    });
    pr.days.sort((a, b) => (isLegs(a) ? 0 : 1) - (isLegs(b) ? 0 : 1));
  } else if (split === "shoulder") {
    pr.days.forEach((d) => {
      if (isUpper(d)) {
        if (!has(d.exercises, ["lateral", "press behind", "shoulder press"])) d.exercises.unshift(mk("Cable Lateral Raise", "priority \u2014 strict, no swing"));
        d.exercises = moveFirst(d.exercises, ["lateral", "press behind", "shoulder press"]);
      }
    });
  } else if (split === "chest") {
    pr.days.forEach((d) => {
      if (isUpper(d)) {
        if (!has(d.exercises, ["incline dumbbell press", "clavicular", "flye", "dips"])) d.exercises.unshift(mk("Incline Dumbbell Press", "priority \u2014 full stretch"));
        d.exercises = moveFirst(d.exercises, ["incline dumbbell press", "clavicular", "flye", "dips"]);
      }
    });
  } else if (split === "arm") {
    pr.days.forEach((d) => {
      if (isUpper(d)) {
        if (!has(d.exercises, ["curl", "tricep"])) d.exercises.unshift(mk("Alternating DB Curls", "priority \u2014 no swing"));
        d.exercises = moveFirst(d.exercises, ["curl", "tricep", "dips"]);
      }
    });
  }
  pr.split = split;
  return pr;
}

function safeJSON(text) {
  const clean = text.replace(/```json|```/g, "").trim();
  try { return JSON.parse(clean); }
  catch {
    const m = clean.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
    throw new Error("no json");
  }
}

  useEffect(() => { if (loaded) saveKey("mi-program", program); }, [program, loaded]);

        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; gain.gain.value = 0.15;
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      } catch {}
      const t = setTimeout(() => setRestLeft(null), 1200);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setRestLeft((s) => (s === null ? null : s - 1)), 1000);
    return () => clearTimeout(t);
  }, [restLeft]);

  // Wake lock
  useEffect(() => {
    const acquire = async () => {
      try { if ("wakeLock" in navigator) wakeRef.current = await navigator.wakeLock.request("screen"); } catch {}
    };
    acquire();
    const onVis = () => { if (document.visibilityState === "visible") acquire(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { document.removeEventListener("visibilitychange", onVis); try { wakeRef.current?.release(); } catch {} };
  }, []);

  const startRest = (secs = 150) => { setRestTotal(secs); setRestLeft(secs); };

  const key = (w, d) => `w${w}-d${d}`;
  const getSet = (w, d, e, s) => logs[key(w, d)]?.[e]?.sets?.[s] || {};
  const setSet = (d, e, s, field, value) => {
    setLogs((prev) => {
      const k = key(week, d);
      const dd = structuredClone(prev[k] || {});
      if (!dd[e]) dd[e] = { sets: [] };
      if (!dd[e].sets[s]) dd[e].sets[s] = {};
      dd[e].sets[s][field] = value;
      return { ...prev, [k]: dd };
    });
  };
  const markDone = (d, e, val) => {
    setLogs((prev) => {
      const k = key(week, d);
      const dd = structuredClone(prev[k] || {});
      if (!dd[e]) dd[e] = { sets: [] };
      dd[e].done = val;
      return { ...prev, [k]: dd };
    });
  };
  const clearedLastWeek = (d, e) => {
    if (week === 0) return false;
    return Number(getSet(week - 1, d, e, 2).reps) >= 6;
  };
  const clearedNow = (d, e) => Number(getSet(week, d, e, 2).reps) >= 6;
  const showAddLoad = (d, e) => clearedLastWeek(d, e) || clearedNow(d, e);
  const lastWeight = (d, e, s) => getSet(week - 1, d, e, s).weight || "";

  const unit = settings?.unit || "kg";
  const wOut = (v) => (unit === "lb" ? dispW(v, "lb") : (v || ""));
  const wIn = (v) => (unit === "lb" ? storeW(v, "lb") : v);

  const trialLeft = trialStart ? Math.max(0, TRIAL_DAYS - Math.floor((Date.now() - trialStart) / 86400000)) : 0;
  const hasAI = pro || (trialStart && trialLeft > 0);
  const startTrial = () => { if (!trialStart) setTrialStart(Date.now()); };
  const redeemCode = () => {
    const c = codeIn.trim().toUpperCase();
    if (!c) return;
    if (["MAX2026", "MAXBETA", "INTENSITY"].includes(c)) { setPro(true); setCodeIn(""); }
    else alert("Code not recognised — DM Max on Instagram for your access code.");
  };
  const addPoints = (n) => setGame((g) => ({ ...g, points: (g.points || 0) + n }));

  const wk = WEEK_PLAN[week];
  const isDeload = week === 5;
  const baseDay = program.days[activeDay] || { name: "", exercises: [] };
  const ovActive = override && override.date === todayKey() && override.dayIdx === activeDay;
  const day = ovActive ? { ...baseDay, exercises: override.exercises } : baseDay;
  const dayLogs = logs[key(week, activeDay)] || {};
  const doneCount = day.exercises.filter((_, i) => dayLogs[i]?.done).length;
  const setsFor = (exr) => (isDeload ? 2 : exr.scheme.length);

  // ---- history save (no tab switch) ----
  const saveSessionToHistory = () => {
    const d = todayKey();
    const snapshot = {
      week: week + 1,
      day: day.name,
      items: day.exercises.map((exr, i) => ({
        name: exr.name,
        sets: (((dayLogs[i] || {}).sets) || []).filter(Boolean).map((s) => ({ w: s.weight || "", r: s.reps || "" })),
      })),
    };
    setHistory((prev) => ({ ...prev, [d]: snapshot }));
    setSelDate(d);
  };

  // ---- guided session flow ----
  const startSession = () => { setSession({ ex: 0, set: 0, resting: false }); setRestLeft(null); setSessionPts(0); };
  const endSession = () => { setSession(null); setRestLeft(null); };
  const anyLogged = () => day.exercises.some((_, i) => ((((dayLogs[i] || {}).sets) || []).filter((s) => s && (s.weight || s.reps)).length > 0));
  const endSessionEarly = () => { if (anyLogged()) saveSessionToHistory(); endSession(); };
  const goBackSet = () => {
    setSession((s) => {
      if (!s || s.done) return s;
      if (s.resting) return { ...s, resting: false };
      if (s.set > 0) return { ex: s.ex, set: s.set - 1, resting: false };
      if (s.ex > 0) { const pe = s.ex - 1; return { ex: pe, set: setsFor(day.exercises[pe]) - 1, resting: false }; }
      return s;
    });
  };
  const awardSession = () => {
    let setsLogged = 0, improvements = 0;
    day.exercises.forEach((_, i) => {
      setsLogged += ((((dayLogs[i] || {}).sets) || []).filter((s) => s && (s.weight || s.reps)).length);
      if (week > 0) {
        const cur = getSet(week, activeDay, i, 2), prv = getSet(week - 1, activeDay, i, 2);
        if ((Number(cur.weight) || 0) > (Number(prv.weight) || 0) || (Number(cur.reps) || 0) > (Number(prv.reps) || 0)) improvements++;
      }
    });
    const pts = setsLogged * 10 + improvements * 25;
    setSessionPts(pts);
    addPoints(pts);
  };
  const advancePointer = (s) => {
    const exr = day.exercises[s.ex];
    const n = setsFor(exr);
    if (s.set + 1 < n) return { ex: s.ex, set: s.set + 1, resting: false };
    if (s.ex + 1 < day.exercises.length) return { ex: s.ex + 1, set: 0, resting: false };
    return { done: true };
  };
  const logSetAndContinue = () => {
    if (!session || session.done) return;
    const exr = day.exercises[session.ex];
    const n = setsFor(exr);
    if (session.set === n - 1) markDone(activeDay, session.ex, true);
    const nxt = advancePointer(session);
    if (nxt.done) {
      saveSessionToHistory();
      awardSession();
      setSession({ done: true });
      setRestLeft(null);
    } else {
      setSession({ ...session, resting: true });
      startRest(150);
    }
  };
  // When rest finishes during a session, move to the next set
  useEffect(() => {
    if (session && session.resting && restLeft === null) {
      setSession((s) => (s && s.resting ? advancePointer(s) : s));

    if (!q || swapping) return;

    try { const out = await askSwaps(q, goalLabel()); setSwaps(out.swaps || []); }
    catch (e) { setSwaps([{ from: "", to: "", why: "Error: " + (e.message || "unknown") + " — tap Swap again." }]); }

  const runMealBuilder = (remaining) => async () => {
    if (buildingMeal) return;
    setBuildingMeal(true);
    try { setMealIdea(await buildMealAI(myFoods, remaining, goalLabel())); } catch {}
    setBuildingMeal(false);
  };
  const saveBodyweight = () => {
    const v = Number(bwInput);
    if (!v) return;
    setWeights((prev) => ({ ...prev, [todayKey()]: v }));

  const updateEx = (i, field, value) => {
    setProgram((prev) => {

      p.days[activeDay].exercises[i][field] = value;
      return p;
    });
  };
  const removeEx = (i) => {
    setProgram((prev) => {
      const p = structuredClone(prev);
      p.days[activeDay].exercises.splice(i, 1);
      return p;
    });
  };
  const addEx = () => {
    setProgram((prev) => {
      const p = structuredClone(prev);
      p.days[activeDay].exercises.push({ name: "New Exercise", scheme: [10, 6, 6, 6], note: "", tempo: "4-3-2-1", rest: "2\u20133 min" });
      return p;
    });
  };
  const aiSwapExercise = async (i) => {
    if (exSwapping !== null) return;
    if (!hasAI) { alert("AI swap is part of MAX AI — start your free trial from the Coach tab."); return; }
    setExSwapping(i);
    try {
      const exr = day.exercises[i];
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 200,
          system: 'Suggest ONE substitute exercise hitting the same muscles, doable with dumbbells, a cable stand, a dip stand, an incline bench and a Smith machine. Keep the Max Intensity style: strict tempo, chest-supported where possible. Respond ONLY with raw JSON, no fences: {"name":"exercise name","note":"short setup tip"}',
          messages: [{ role: "user", content: `Replace: ${exr.name}${exr.note ? " (" + exr.note + ")" : ""}. Other exercises that day: ${day.exercises.map((e) => e.name).join(", ")}. Suggest something not already in that list.` }],
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || "API error");
      const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).join("");
      const out = safeJSON(text);
      if (out && out.name) {
        setProgram((prev) => {
          const p = structuredClone(prev);
          p.days[activeDay].exercises[i].name = out.name;
          p.days[activeDay].exercises[i].note = out.note || "";
          return p;
        });
      }
    } catch {}
    setExSwapping(null);
  };
  const startVoice = (mode) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input isn't supported in this browser — type it instead."); return; }
    try {
      const r = new SR();
      r.lang = "en-GB";
      r.onresult = (e) => {
        const t = e.results[0][0].transcript || "";
        if (mode === "food") { setFoodInput(t); }
        else if (session && !session.done && !session.resting) {
          const nums = (t.match(/\d+(?:\.\d+)?/g) || []).map(Number);
          if (nums[0] != null) setSet(activeDay, session.ex, session.set, "weight", wIn(String(nums[0])));
          if (nums[1] != null) setSet(activeDay, session.ex, session.set, "reps", String(Math.round(nums[1])));
        }
      };
      r.onend = () => setListening(false);
      r.onerror = () => setListening(false);
      setListening(true); r.start(); recRef.current = r;
    } catch { setListening(false); }
  };

  const runEditSession = async () => {
    const q = editReq.trim();
    if (!q || editingSession) return;
    setEditingSession(true);
    try {
      const out = await aiEditSession(q, baseDay, week);
      if (out && out.exercises && out.exercises.length) {
        setOverride({ date: todayKey(), dayIdx: activeDay, exercises: out.exercises, reply: out.reply || "Session adjusted." });
        setEditReq(""); setShowEditReq(false);
      }
    } catch {}
    setEditingSession(false);
  };

  const moveEx = (i, dir) => {
    setProgram((prev) => {
      const p = structuredClone(prev);
      const arr = p.days[activeDay].exercises;
      const j = i + dir;
      if (j < 0 || j >= arr.length) return prev;
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      return p;
    });
  };

  const openDemo = (name) => {
    window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " exercise proper form"), "_blank");
  };

  const send = async () => {
    const q = input.trim();
    if (!q || thinking) return;
    const hist = [...chat, { role: "user", content: q }];
    setChat(hist);
    setInput("");
    setThinking(true);
    try {
      const out = await askCoach(hist, program, week);
      setChat((c) => [...c, { role: "assistant", content: out.reply }]);
      if (out.program && out.program.days) setProgram(out.program);
    } catch {
      setChat((c) => [...c, { role: "assistant", content: "Couldn't reach the coach. Try again." }]);
    }
    setThinking(false);
  };

  // ---- design system ----
  const card = "rounded-xl border border-neutral-800 bg-[#141414]";
  const chip = "rounded-md px-3 py-1.5 text-xs font-semibold";
  const cta = "dp rounded-lg bg-[#FF2B2B] text-white uppercase tracking-[0.12em] active:bg-red-700";
  const eyebrow = "mono text-[10px] uppercase tracking-[0.25em] text-[#FF2B2B]";

  // ---- onboarding: one question per screen, tap to advance ----
  const OB_STEPS = [
    { k: "name", q: "Who's training?", type: "input", ph: "Your name" },
    { k: "sex", q: "About you", opts: ["Male", "Female"] },
    { k: "goal", q: "The goal", opts: ["Build muscle", "Lose fat", "Both"] },
    { k: "split", q: "Where's the focus?", sub: "Priority muscles go first in every session — they get your best energy.", opts: [["balanced", "Balanced"], ["legglute", "Legs & glutes"], ["shoulder", "Shoulders"], ["chest", "Chest"], ["arm", "Arms"]] },
    { k: "exp", q: "Time in the gym", opts: ["Just starting", "1–3 years", "3+ years"] },
    { k: "daysPerWeek", q: "Days per week", sub: "The block is built on 4. Pick what you'll actually hit.", opts: [3, 4, 5] },
    { k: "unit", q: "kg or lb?", opts: ["kg", "lb"] },
    { k: "injuries", q: "Anything to work around?", type: "input", ph: "e.g. left shoulder — or skip", skip: true },
  ];
  const obFinish = () => {
    setObBuilding(true);
    setTimeout(() => {
      const s = { ...ob, name: ob.name.trim() || "Athlete", done: true };
      setSettings(s);
      if (s.split !== "balanced") setProgram((p) => applySplit(p, s.split));
      setObBuilding(false);
      setObStep(0);
    }, 1600);
  };
  const obPick = (k, v) => {
    setOb((o) => ({ ...o, [k]: v }));
    setTimeout(() => (obStep === OB_STEPS.length - 1 ? obFinish() : setObStep((st) => st + 1)), 180);
  };
  const renderOnboarding = () => {
    if (!loaded || (settings && settings.done)) return null;
    if (obBuilding) {
      return (
        <div className="fixed inset-0 z-[90] flex flex-col items-center justify-center bg-[#050505] px-8 text-center">
          <img src={BICEP} alt="" className="h-14 w-auto" />
          <p className="dp mt-6 text-3xl uppercase text-[#F2EFE8]">Building your<br /><span className="text-[#FF2B2B]">program</span></p>
          <div className="mono mt-6 space-y-2 text-xs text-neutral-500">
            <p>✓ 6-week block · 10/6/6/6 · tempo 4-3-2-1</p>
            <p>✓ {String(ob.split) === "balanced" ? "Balanced split" : "Priority muscles moved first"}</p>
            <p>✓ {ob.daysPerWeek} sessions a week, planned for you</p>

          <p className="mono mt-8 text-[10px] uppercase tracking-[0.3em] text-neutral-600">Train harder · Think less</p>

    return (

        <div className="mt-4 flex items-center justify-between">

            <button onClick={() => setObStep((s) => s - 1)} className="mono text-sm text-neutral-500" aria-label="Back">‹ Back</button>

          <span className="mono text-[10px] text-neutral-600">{obStep + 1} / {OB_STEPS.length}</span>
        </div>
        <p className="dp mt-8 text-[38px] uppercase leading-[0.95] text-[#F2EFE8]">{st.q}</p>
        {st.sub && <p className="mt-3 text-sm leading-relaxed text-neutral-500">{st.sub}</p>}
        <div className="mt-8 flex-1">
          {st.type === "input" ? (
            <>
              <input
                autoFocus
                value={val}
                onChange={(e) => setOb((o) => ({ ...o, [st.k]: e.target.value }))}
                onKeyDown={(e) => { if (e.key === "Enter") (obStep === OB_STEPS.length - 1 ? obFinish() : setObStep((s) => s + 1)); }}
                placeholder={st.ph}
                className="w-full border-b-2 border-neutral-800 bg-transparent pb-3 text-2xl text-[#F2EFE8] placeholder-neutral-700 focus:border-[#FF2B2B] focus:outline-none"
              />
            </>
          ) : (
            <div className="space-y-2.5">
              {st.opts.map((o) => {
                const v = Array.isArray(o) ? o[0] : o;
                const l = Array.isArray(o) ? o[1] : String(o);
                const on = val === v;
                return (
                  <button
                    key={String(v)}
                    onClick={() => obPick(st.k, v)}
                    className={
                      "dp block w-full rounded-lg border px-5 py-[18px] text-left text-lg uppercase tracking-wide transition-colors " +
                      (on ? "border-[#FF2B2B] bg-[#FF2B2B] text-white" : "border-neutral-800 bg-[#111] text-neutral-300 active:border-[#FF2B2B]")
                    }
                  >
                    {l}
                  </button>
                );
              })}
            </div>
          )}
        </div>
        {st.type === "input" && (
          <button onClick={() => (obStep === OB_STEPS.length - 1 ? obFinish() : setObStep((s) => s + 1))} className={cta + " w-full py-4 text-base"}>
            {obStep === OB_STEPS.length - 1 ? (val ? "Build my program" : "Skip — build my program") : "Continue"}
          </button>

  // ---- lock card ----

      <div className="p-5">
        <p className={eyebrow}>Max AI</p>
        <p className="dp mt-1 text-2xl uppercase leading-none text-[#F2EFE8]">{title}</p>

        ) : (
          <div className="mt-4">
            <p className="mono text-xs text-neutral-500">Trial ended — MAX AI is £7.99/mo. DM Max for your code.</p>
            <div className="mt-2 flex gap-2">
              <input value={codeIn} onChange={(e) => setCodeIn(e.target.value)} placeholder="ACCESS CODE" className="mono flex-1 rounded-lg bg-neutral-900 px-3 py-2.5 text-sm uppercase placeholder-neutral-700" />
              <button onClick={redeemCode} className={cta + " px-4 text-xs"}>Unlock</button>
            </div>
          </div>
        )}
        <p className="mono mt-3 text-[9px] uppercase tracking-[0.2em] text-neutral-600">Serious training · Zero intimidation</p>
      </div>

  // ---- settings ----
  const renderSettings = () => {
    if (!showSettings) return null;
    const seg = (on) => chip + " " + (on ? "bg-[#FF2B2B] text-white" : "border border-neutral-800 text-neutral-400");
    return (
      <div className="fixed inset-0 z-[80] overflow-y-auto bg-[#050505] px-5 pb-10 pt-6">
        <div className="flex items-center justify-between">
          <p className="dp text-2xl uppercase text-[#F2EFE8]">Settings</p>
          <button onClick={() => setShowSettings(false)} className={cta + " px-4 py-2 text-xs"}>Done</button>
        </div>
        <p className={eyebrow + " mt-7"}>Units</p>
        <div className="mt-2 flex gap-1.5">
          {["kg", "lb"].map((u) => (
            <button key={u} onClick={() => setSettings((s) => ({ ...(s || { done: true }), unit: u, done: true }))} className={seg(unit === u)}>{u}</button>
          ))}
        </div>
        <p className={eyebrow + " mt-6"}>Split focus</p>
        <div className="mt-2 flex flex-wrap gap-1.5">
          {[["balanced", "Balanced"], ["legglute", "Legs & glutes"], ["shoulder", "Shoulders"], ["chest", "Chest"], ["arm", "Arms"]].map(([v, l]) => (
            <button key={v} onClick={() => { setSettings((s) => ({ ...(s || { done: true }), split: v, done: true })); if (v !== "balanced") setProgram((p) => applySplit(p, v)); }} className={seg(settings?.split === v)}>{l}</button>
          ))}
        </div>
        <p className="mt-1.5 text-[11px] text-neutral-600">Changing focus moves your priority muscles to the front of each session.</p>
        <p className={eyebrow + " mt-6"}>How to edit your workout</p>
        <div className={card + " mt-2 p-4 text-sm leading-relaxed text-neutral-400"}>
          1. Train tab → tap <span className="text-neutral-200">Edit</span> above the list.<br />
          2. Rename, ↑↓ to reorder, Remove, or <span className="text-neutral-200">+ Add exercise</span>.<br />
          3. Tap <span className="text-neutral-200">Done</span> — it saves itself.
        </div>
        <p className={eyebrow + " mt-6"}>Max AI</p>
        <div className={card + " mt-2 p-4"}>
          {pro ? <p className="mono text-xs text-[#FF2B2B]">Unlocked — full access ✓</p>
            : trialStart && trialLeft > 0 ? <p className="mono text-xs text-[#FF2B2B]">Trial — {trialLeft} day{trialLeft === 1 ? "" : "s"} left</p>
            : trialStart ? (
              <div>
                <p className="mono text-xs text-neutral-500">Trial ended. £7.99/mo — DM Max for your code.</p>
                <div className="mt-2 flex gap-2">
                  <input value={codeIn} onChange={(e) => setCodeIn(e.target.value)} placeholder="ACCESS CODE" className="mono flex-1 rounded-lg bg-neutral-900 px-3 py-2 text-sm uppercase placeholder-neutral-700" />
                  <button onClick={redeemCode} className={cta + " px-4 text-xs"}>Unlock</button>
                </div>
              </div>
            ) : <p className="mono text-xs text-neutral-500">Free trial not started — any locked screen starts it.</p>}
        </div>
        <button onClick={() => { setSettings((s) => ({ ...(s || {}), done: false })); setObStep(0); setShowSettings(false); }} className="mono mt-7 w-full rounded-lg border border-neutral-800 py-3 text-xs text-neutral-400">Re-run the setup questions</button>
        <p className="mono mt-5 text-center text-[9px] uppercase tracking-[0.25em] text-neutral-700">Max Intensity · V3</p>
      </div>
    );
  };

  // ---- guided session ----
  const renderSession = () => {
    if (!session) return null;
    if (session.done) {
      const totalSets = day.exercises.reduce((t, exr, i) => t + (((dayLogs[i] || {}).sets) || []).filter((s) => s && (s.weight || s.reps)).length, 0);
      return (
        <div className="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-[#050505] px-6 text-center">
          <p className="dp text-[52px] uppercase leading-[0.9] text-[#F2EFE8]">Session<br /><span className="text-[#FF2B2B]">complete</span></p>
          <p className="mono mt-4 text-sm text-neutral-400">{day.name} · Week {week + 1} · {totalSets} sets</p>
          {sessionPts > 0 && <p className="dp mt-3 text-2xl uppercase text-[#FF2B2B]">+{sessionPts} pts</p>}
          <p className="mono mt-1 text-xs text-neutral-500">🔥 {game.streak}-day streak · saved to your calendar</p>
          <p className="mt-5 max-w-xs text-sm text-neutral-500">Progress built one completed session at a time. Now leave and grow.</p>
          <button onClick={endSession} className={cta + " mt-8 w-full max-w-xs py-4 text-base"}>Done</button>
        </div>
      );
    }
    const exr = day.exercises[session.ex];
    const n = setsFor(exr);
    const label = isDeload ? `Set ${session.set + 1} ×6 easy` : SET_LABELS[session.set];
    const setLog = getSet(week, activeDay, session.ex, session.set);
    const prev = lastWeight(activeDay, session.ex, session.set);
    const isWork = !isDeload && session.set === 2;
    return (
      <div className="fixed inset-0 z-[60] flex flex-col bg-[#050505]">
        <div className="px-5 pt-5">
          <div className="flex items-center justify-between">
            <button onClick={goBackSet} className="mono text-xs text-neutral-500" aria-label="Back one set">‹ Back</button>
            <span className="mono text-[10px] uppercase tracking-widest text-neutral-500">Ex {session.ex + 1}/{day.exercises.length} · Set {session.set + 1}/{n}</span>
            <button onClick={endSessionEarly} className="mono rounded-md border border-neutral-800 px-2.5 py-1 text-xs text-neutral-400" aria-label="Exit and save">✕ Exit</button>
          </div>
          {/* segmented progress: one segment per set */}
          <div className="mt-3 flex gap-1">
            {day.exercises.map((e2, ei) =>
              Array.from({ length: setsFor(e2) }).map((_, si) => {
                const past = ei < session.ex || (ei === session.ex && si < session.set);
                const cur = ei === session.ex && si === session.set;
                return <div key={ei + "-" + si} className={"h-1 flex-1 rounded-full " + (cur ? "bg-[#FF2B2B]" : past ? "bg-neutral-500" : "bg-neutral-800")} />;
              })
            )}
          </div>
        </div>

        {session.resting ? (
          <div className="flex flex-1 flex-col items-center justify-center px-6 text-center">
            <p className="dp text-3xl uppercase tracking-widest text-[#FF2B2B]">Rest</p>
            <p className="mono mt-2 text-[84px] font-semibold leading-none text-[#F2EFE8]">
              {Math.floor(Math.max(0, restLeft ?? 0) / 60)}:{String(Math.max(0, restLeft ?? 0) % 60).padStart(2, "0")}
            </p>
            <p className="mt-4 text-sm text-neutral-500">Full recovery, full intensity. That's the trade.</p>
            <div className="mt-8 flex gap-3">
              <button onClick={() => setRestLeft((s) => (s === null ? null : s + 30))} className="mono rounded-lg border border-neutral-700 px-5 py-3 text-sm text-neutral-300">+30s</button>
              <button onClick={() => setRestLeft(null)} className={cta + " px-8 py-3 text-sm"}>Skip →</button>

        ) : (
          <div className="flex flex-1 flex-col px-6 pt-7">
            <p className={eyebrow}>{label}</p>
            <p className="dp mt-1 text-[34px] uppercase leading-[0.95] text-[#F2EFE8]">{exr.name}</p>
            {exr.note ? <p className="mt-1.5 text-sm text-neutral-500">{exr.note}</p> : null}
            <div className="mt-3 flex flex-wrap gap-2">
              <span className={chip + " border border-neutral-800 bg-[#141414] text-neutral-400"}>tempo {exr.tempo}</span>
              <span className={chip + " border border-neutral-800 bg-[#141414] text-neutral-400"}>rest {exr.rest}</span>
              <button onClick={() => openDemo(exr.name)} className={chip + " border border-neutral-800 bg-[#141414] text-neutral-300"}>▶ form</button>
            </div>

              <div className={(isWork ? "rounded-xl bg-[#FF2B2B] " : card + " ") + "p-4"}>
                <div className="flex items-center justify-between">
                  <p className={"mono text-[10px] uppercase " + (isWork ? "text-red-100" : "text-neutral-500")}>Weight ({unit})</p>
                  <button onClick={() => startVoice("sess")} className={"mono text-xs " + (listening ? (isWork ? "text-white" : "text-[#FF2B2B]") : (isWork ? "text-red-200" : "text-neutral-600"))} aria-label="Voice input">{listening ? "● rec" : "🎤"}</button>
                </div>
                <input
                  id="sess-w"
                  inputMode="decimal"

                  value={wOut(setLog.weight)}
                  onChange={(e) => setSet(activeDay, session.ex, session.set, "weight", wIn(e.target.value))}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("sess-r")?.focus(); } }}
                  onFocus={() => setSessFocus("w")}

                  placeholder={prev ? wOut(prev) : "—"}
                  className={"mono mt-1 w-full bg-transparent text-4xl font-semibold focus:outline-none " + (isWork ? "text-white placeholder-red-200/60" : "text-[#F2EFE8] placeholder-neutral-700")}
                  aria-label="Weight"
                />
                {prev && <p className={"mono mt-1 text-[10px] " + (isWork ? "text-red-100/80" : "text-neutral-600")}>last wk: {wOut(prev)} {unit}</p>}
              </div>
              <div className={(isWork ? "rounded-xl bg-[#FF2B2B] " : card + " ") + "p-4"}>

                <input
                  id="sess-r"

                  enterKeyHint="go"

                )}

                <p className={eyebrow + " mt-6 mb-1"}>Swap machine</p>
                <p className="mb-2 text-[11px] text-neutral-600">Tell it a habit — smarter swaps, never bans.</p>
                <div className="flex gap-2">
                  <input value={swapInput} onChange={(e) => setSwapInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && runSwaps()} placeholder="e.g. I drink loads of fizzy drinks" className="flex-1 rounded-lg border border-neutral-800 bg-[#141414] px-3.5 py-2.5 text-sm placeholder-neutral-600" />
                  <button onClick={runSwaps} disabled={swapping || !hasAI} className={cta + " px-4 text-xs disabled:opacity-50"}>{swapping ? "…" : hasAI ? "Swap" : "🔒"}</button>
                </div>
                {swaps.length > 0 && (
                  <div className="mt-2 space-y-2">
                    {swaps.map((s, i) => (
                      <div key={i} className={card + " p-3.5"}>
                        {s.from && <p className="text-sm text-neutral-200"><span className="text-neutral-500 line-through">{s.from}</span> → <span className="font-semibold">{s.to}</span></p>}
                        <p className="mt-0.5 text-xs text-neutral-400">{s.why}</p>
                      </div>
                    ))}
                  </div>
                )}

                <p className={eyebrow + " mt-6 mb-2"}>Quick log</p>
                <div className="flex gap-2">
                  <input value={foodInput} onChange={(e) => setFoodInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addFood()} placeholder="e.g. 300g mince, potatoes, milk" className="flex-1 rounded-lg border border-neutral-800 bg-[#141414] px-3.5 py-2.5 text-sm placeholder-neutral-600" />
                  <button onClick={() => startVoice("food")} className={"mono rounded-lg border border-neutral-700 px-3 text-sm " + (listening ? "text-[#FF2B2B]" : "text-neutral-400")} aria-label="Voice food log">{listening ? "●" : "🎤"}</button>
                  <button onClick={addFood} disabled={estimating || !hasAI} className={cta + " px-4 text-xs disabled:opacity-50"}>{estimating ? "…" : hasAI ? "Log" : "🔒"}</button>
                </div>
                <p className="mono mt-1.5 text-[9px] text-neutral-600">AI estimates the macros — weigh the big stuff.</p>

                <ul className="mt-3 space-y-2">
                  {entries.length === 0 && (
                    <li className="rounded-xl border border-dashed border-neutral-800 p-4 text-center text-sm text-neutral-600">
                      Nothing logged today. Eat early — no need to store.
                    </li>
                  )}
                  {entries.map((e, i) => (
                    <li key={i} className={card + " flex items-center gap-3 p-3.5"}>
                      <div className="min-w-0 flex-1">
                        <p className="truncate text-sm text-neutral-100">{e.name}</p>
                        <p className="mono mt-0.5 text-xs text-neutral-500">{e.kcal} kcal · P{e.protein} C{e.carbs} F{e.fat}</p>
                      </div>
                      <button onClick={() => removeFood(i)} className="mono text-xs text-neutral-600" aria-label={`Remove ${e.name}`}>✕</button>
                    </li>
                  ))}
                </ul>
              </>
            )}
          </main>
        );
      })()}

      {/* ---------- LOG ---------- */}
      {tab === "calendar" && (() => {
        const y = calMonth.getFullYear();
        const m = calMonth.getMonth();
        const firstOffset = (new Date(y, m, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const ds = (d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const monthName = calMonth.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
        const sel = history[selDate];
        const selBw = weights[selDate];
        const bwEntries = Object.entries(weights).sort((a, b) => a[0].localeCompare(b[0])).slice(-14);
        const bwVals = bwEntries.map(([, v]) => v);
        const bwMin = Math.min(...bwVals), bwMax = Math.max(...bwVals);
        const spark = bwVals.length > 1
          ? bwVals.map((v, i) => `${(i / (bwVals.length - 1)) * 100},${bwMax === bwMin ? 20 : 38 - ((v - bwMin) / (bwMax - bwMin)) * 36}`).join(" ")
          : null;
        return (
          <main className="px-4 pb-32 pt-3">
            <div className={card + " p-4"}>
              <div className="flex items-center gap-2">
                <div className="min-w-0 flex-1">
                  <p className="dp text-sm uppercase text-neutral-200">Daily bodyweight</p>
                  <p className="mt-0.5 text-[10px] text-neutral-500">Same time each day — morning, after the toilet, before food.</p>
                </div>
                <input inputMode="decimal" value={bwInput} onChange={(e) => setBwInput(e.target.value)} placeholder={weights[todayKey()] ? `${weights[todayKey()]}` : "kg"} className="mono w-20 rounded-lg bg-neutral-900 px-2 py-2 text-right text-sm placeholder-neutral-600" aria-label="Bodyweight in kg" />
                <button onClick={saveBodyweight} className={cta + " px-3.5 py-2 text-[10px]"}>Save</button>
              </div>
              {spark && (
                <div className="mt-2">
                  <svg viewBox="0 0 100 40" className="h-10 w-full" preserveAspectRatio="none" aria-hidden="true">
                    <polyline points={spark} fill="none" stroke="#FF2B2B" strokeWidth="2" vectorEffect="non-scaling-stroke" />
                  </svg>
                  <p className="mono text-[9px] text-neutral-600">last {bwVals.length} weigh-ins · {bwVals[bwVals.length - 1]} kg latest</p>
                </div>
              )}
            </div>

            <div className="mt-4 flex items-center justify-between">
              <button onClick={() => setCalMonth(new Date(y, m - 1, 1))} className="rounded-lg border border-neutral-800 px-3 py-1 text-sm text-neutral-400" aria-label="Previous month">‹</button>
              <h2 className="dp text-base uppercase tracking-wide text-neutral-200">{monthName}</h2>
              <button onClick={() => setCalMonth(new Date(y, m + 1, 1))} className="rounded-lg border border-neutral-800 px-3 py-1 text-sm text-neutral-400" aria-label="Next month">›</button>
            </div>
            <div className="mono mt-2 grid grid-cols-7 gap-1 text-center text-[9px] text-neutral-600">
              {["M", "T", "W", "T2", "F", "S", "S2"].map((d) => <div key={d}>{d.charAt(0)}</div>)}
            </div>
            <div className="mt-1 grid grid-cols-7 gap-1">
              {Array.from({ length: firstOffset }).map((_, i) => <div key={"e" + i} />)}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const dnum = i + 1;
                const dstr = ds(dnum);
                const trained = !!history[dstr];
                const weighed = weights[dstr] != null;
                const isSel = selDate === dstr;
                const isToday = dstr === todayKey();
                return (
                  <button
                    key={dstr}
                    onClick={() => setSelDate(dstr)}
                    className={
                      "flex aspect-square flex-col items-center justify-center rounded-lg text-xs " +
                      (isSel ? "bg-[#FF2B2B] text-white" : isToday ? "border border-[#FF2B2B] text-neutral-200" : "bg-[#141414] text-neutral-400")
                    }
                  >
                    <span className="mono">{dnum}</span>
                    <span className="flex gap-0.5">
                      {trained && <span className={"h-1 w-1 rounded-full " + (isSel ? "bg-white" : "bg-[#FF2B2B]")} />}
                      {weighed && <span className={"h-1 w-1 rounded-full " + (isSel ? "bg-white/60" : "bg-neutral-500")} />}
                    </span>
                  </button>
                );
              })}
            </div>
            <p className="mono mt-1.5 text-[9px] text-neutral-600"><span className="text-[#FF2B2B]">●</span> trained · <span className="text-neutral-500">●</span> weighed in · blank = rest, part of the plan</p>

            <div className={card + " mt-4 p-4"}>
              <p className="dp text-sm uppercase text-neutral-200">
                {new Date(selDate + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" })}
              </p>
              {selBw != null && <p className="mono mt-1 text-xs text-neutral-400">Bodyweight: {selBw} kg</p>}
              {sel ? (
                <div className="mt-2">
                  <p className="mono text-xs text-[#FF2B2B]">{sel.day} · Week {sel.week}</p>
                  <ul className="mt-1.5 space-y-1">
                    {sel.items.map((it, i) => (
                      <li key={i} className="flex items-baseline justify-between gap-2 text-sm">
                        <span className="min-w-0 truncate text-neutral-300">{it.name}</span>
                        <span className="mono shrink-0 text-xs text-neutral-500">
                          {it.sets.filter((s) => s.w || s.r).map((s) => `${s.w || "?"}×${s.r || "?"}`).join("  ") || "—"}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>
              ) : (
                !selBw && <p className="mt-1.5 text-sm text-neutral-600">{selDate < todayKey() ? "Rest day — part of the plan." : selDate === todayKey() ? "Nothing logged yet today." : "Planned — nothing yet."}</p>
              )}
            </div>

            {(() => {
              const opts = [];
              program.days.forEach((d, di) => d.exercises.forEach((e2, ei) => opts.push([di + "-" + ei, d.name + " — " + e2.name])));
              const [gd, ge] = graphSel.split("-").map(Number);
              const pts = [];
              for (let w2 = 0; w2 < 6; w2++) {
                const v = Number((logs[`w${w2}-d${gd}`]?.[ge]?.sets?.[2] || {}).weight);
                if (v) pts.push([w2, v]);
              }
              const vals = pts.map((p2) => p2[1]);
              const mn = Math.min(...vals), mx = Math.max(...vals);
              const poly = pts.length > 1 ? pts.map(([w2, v]) => `${(w2 / 5) * 100},${mx === mn ? 20 : 38 - ((v - mn) / (mx - mn)) * 34}`).join(" ") : null;
              const last = pts.length ? pts[pts.length - 1] : null;
              const proj = last ? Math.round(last[1] * Math.pow(1.025, Math.max(0, 4 - last[0])) * 10) / 10 : null;
              return (
                <div className={card + " mt-4 p-4"}>
                  <p className="dp text-sm uppercase text-neutral-200">Progress</p>
                  <select value={graphSel} onChange={(e) => setGraphSel(e.target.value)} className="mono mt-2 w-full rounded-lg border border-neutral-800 bg-neutral-900 px-3 py-2.5 text-xs text-neutral-200" aria-label="Choose exercise">
                    {opts.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                  {poly ? (
                    <div className="mt-3">
                      <svg viewBox="0 0 100 40" className="h-16 w-full" preserveAspectRatio="none" aria-hidden="true">
                        <polyline points={poly} fill="none" stroke="#FF2B2B" strokeWidth="2" vectorEffect="non-scaling-stroke" />
                      </svg>
                      <div className="mono mt-1 flex justify-between text-[9px] text-neutral-600"><span>W1</span><span>W6</span></div>
                    </div>
                  ) : (
                    <p className="mt-3 text-xs text-neutral-600">Log the work set across weeks and the line appears here — the feeling of progress, made visible.</p>
                  )}
                  {last && (
                    <p className="mono mt-2 text-xs text-neutral-400">
                      Work set: <span className="text-neutral-100">{wOut(String(last[1]))} {unit}</span> (W{last[0] + 1})
                      {proj && last[0] < 4 ? <span> · on track for <span className="text-[#FF2B2B]">~{wOut(String(proj))} {unit} ×6 by W5</span></span> : null}
                    </p>
                  )}
                  <p className="mono mt-1 text-[9px] text-neutral-600">Clear 6 on the work set → +2.5%. Small jumps, every week — that's the whole game.</p>
                </div>
              );
            })()}

            <div className={card + " mt-4 p-4"}>
              <p className="dp text-sm uppercase text-neutral-200">Your numbers</p>
              <div className="mono mt-2 grid grid-cols-3 gap-2 text-center">
                <div className="rounded-lg bg-neutral-900 py-2.5"><p className="text-lg font-semibold text-neutral-100">⭐ {game.points}</p><p className="text-[9px] uppercase text-neutral-500">points</p></div>
                <div className="rounded-lg bg-neutral-900 py-2.5"><p className="text-lg font-semibold text-neutral-100">🔥 {game.streak}</p><p className="text-[9px] uppercase text-neutral-500">day streak</p></div>
                <div className="rounded-lg bg-neutral-900 py-2.5"><p className="text-lg font-semibold text-neutral-100">{game.best}</p><p className="text-[9px] uppercase text-neutral-500">best streak</p></div>
              </div>
              <p className="mt-2 text-[10px] text-neutral-600">+10 per set logged · +25 for beating last week · +5 daily login. Showing up is the skill.</p>
            </div>
            <div className={card + " mt-3 p-4 text-center opacity-80"}>
              <p className="mono text-xl">🏆</p>
              <p className="dp mt-0.5 text-sm uppercase text-neutral-200">Leaderboard — coming soon</p>
              <p className="mt-1 text-xs text-neutral-500">Climb against the community. Points, streaks, transformations.</p>
            </div>
          </main>
        );
      })()}

      {/* ---------- LEARN ---------- */}
      {tab === "rules" && (
        <main className="space-y-6 px-4 pb-32 pt-3">
          <section>
            <h2 className={eyebrow}>Lessons — 60 seconds each</h2>
            <div className="mt-2 space-y-2">
              {LESSONS.map((l, i) => (
                <div key={i} className={card}>
                  <button onClick={() => setOpenLesson(openLesson === i ? null : i)} className="flex w-full items-center justify-between p-4 text-left">
                    <p className="dp text-sm uppercase tracking-wide text-neutral-100">{l.t}</p>
                    <span className="mono text-xs text-neutral-600">{openLesson === i ? "−" : "+"}</span>
                  </button>
                  {openLesson === i && <p className="px-4 pb-4 text-sm leading-relaxed text-neutral-400">{l.b}</p>}
                </div>
              ))}
            </div>
          </section>
          <section>
            <h2 className={eyebrow}>The four pillars</h2>
            <div className="mt-2 space-y-2">
              {PILLARS.map((p) => (
                <div key={p.title} className={card + " p-4"}>
                  <p className="dp text-sm uppercase tracking-wide text-neutral-100">{p.title}</p>
                  <p className="mt-1 text-sm leading-relaxed text-neutral-400">{p.body}</p>
                </div>
              ))}
            </div>
          </section>
          {[["Eating rules", NUTRITION_RULES], ["Supplements", SUPPLEMENTS], ["Sleep", SLEEP_RULES]].map(([title, list]) => (
            <section key={title}>
              <h2 className={eyebrow}>{title}</h2>
              <ul className="mt-2 space-y-1.5">
                {list.map((r, i) => (
                  <li key={i} className="flex gap-2 text-sm leading-relaxed text-neutral-400">
                    <span className="mono text-[#7f1d1d]">—</span>{r}
                  </li>
                ))}
              </ul>
            </section>
          ))}
        </main>
      )}

      {/* ---------- COACH ---------- */}
      {tab === "coach" && !hasAI && (
        <main className="px-4 pb-32 pt-4">
          <LockCard title="Max in your pocket" lines={["A coach trained on the Max Intensity philosophy — ask anything, stall on a lift, rebuild a day, plan your food.", "A plan for the days motivation disappears."]} />
          <div className="mt-4 space-y-2 opacity-50">
            {["I stalled on incline press — what now?", "Build me a bulking day of meals", "Why only this much volume?"].map((s) => (
              <div key={s} className={card + " px-3.5 py-2.5 text-sm text-neutral-400"}>{s}</div>
            ))}
          </div>
        </main>
      )}
      {tab === "coach" && hasAI && (
        <main className="flex h-[calc(100vh-215px)] flex-col">
          <div className="flex-1 space-y-3 overflow-y-auto px-4 pt-1">
            {chat.length === 0 && (
              <div className="mt-8 text-center">
                <p className="dp text-2xl uppercase text-neutral-100">Your corner, on call</p>
                <p className="mx-auto mt-2 max-w-xs text-sm text-neutral-500">
                  Trained on the Max Intensity philosophy. Ask anything, or tell it to change the program.
                </p>
                <div className="mx-auto mt-4 flex max-w-xs flex-col gap-2">
                  {["I stalled on incline press — what now?", "Build me a bulking day of meals", "Why only this much volume?"].map((s) => (
                    <button key={s} onClick={() => setInput(s)} className={card + " px-3.5 py-2.5 text-left text-sm text-neutral-300"}>{s}</button>
                  ))}
                </div>
              </div>
            )}
            {chat.map((msg, i) => (
              <div key={i} className={"max-w-[85%] rounded-xl px-3.5 py-2.5 text-sm " + (msg.role === "user" ? "ml-auto bg-[#FF2B2B] text-white" : card + " text-neutral-200")}>
                {msg.content}
              </div>
            ))}
            {thinking && <div className={card + " mono w-fit px-3.5 py-2.5 text-xs text-neutral-500"}>coach is thinking…</div>}
            <div ref={chatEnd} />
          </div>
          <div className="flex gap-2 p-3">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask your coach…" className="flex-1 rounded-lg border border-neutral-800 bg-[#141414] px-3.5 py-2.5 text-sm placeholder-neutral-600" />
            <button onClick={send} disabled={thinking} className={cta + " px-4 text-xs disabled:opacity-50"}>Send</button>
          </div>
        </main>
      )}

      {/* ---------- NEXT FIELD BAR ---------- */}
      {focusField && tab === "program" && !session && (
        <div className="fixed inset-x-3 bottom-20 z-50 flex gap-2">
          <button onPointerDown={(e) => { e.preventDefault(); focusNext(); }} className={cta + " flex-1 py-3 text-sm shadow-xl"}>✓ Next</button>
          <button onPointerDown={(e) => { e.preventDefault(); document.activeElement?.blur(); setFocusField(null); }} className="dp rounded-lg border border-neutral-700 bg-[#141414] px-4 text-xs uppercase text-neutral-300 shadow-xl">Done</button>
        </div>
      )}

      {/* ---------- REST TIMER BAR ---------- */}
      {restLeft !== null && !session && (
        <div className={"fixed inset-x-3 z-40 rounded-xl border border-[#7f1d1d] bg-[#141414]/95 p-3 shadow-xl " + (focusField && tab === "program" ? "bottom-36" : "bottom-20")}>
          <div className="flex items-center gap-3">
            <span className="dp text-[10px] uppercase tracking-widest text-[#FF2B2B]">Rest</span>
            <span className="mono text-2xl font-semibold text-neutral-100">
              {Math.floor(Math.max(0, restLeft) / 60)}:{String(Math.max(0, restLeft) % 60).padStart(2, "0")}
            </span>
            <div className="mx-1 h-1.5 flex-1 rounded-full bg-neutral-800">
              <div className="h-1.5 rounded-full bg-[#FF2B2B] transition-all" style={{ width: `${(Math.max(0, restLeft) / restTotal) * 100}%` }} />
            </div>
            <button onClick={() => setRestLeft((s) => (s === null ? null : s + 30))} className="mono rounded-md border border-neutral-700 px-2 py-1 text-xs text-neutral-300">+30</button>
            <button onClick={() => setRestLeft(null)} className="mono rounded-md border border-neutral-700 px-2 py-1 text-xs text-neutral-400">End</button>
          </div>
        </div>
      )}

      {/* ---------- BOTTOM NAV ---------- */}
      <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-neutral-800 bg-[#050505]/95 pb-[env(safe-area-inset-bottom)] backdrop-blur">
        <div className="flex">
          {NAV.map(([id, label, path]) => (
            <button key={id} onClick={() => setTab(id)} className="relative flex flex-1 flex-col items-center gap-0.5 py-2.5" aria-label={label}>
              {tab === id && <span className="absolute top-0 h-[2px] w-8 bg-[#FF2B2B]" />}
              <svg viewBox="0 0 24 24" className={"h-5 w-5 " + (tab === id ? "stroke-[#FF2B2B]" : "stroke-neutral-600")} fill="none" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d={path} />
              </svg>
              <span className={"dp text-[9px] uppercase tracking-wider " + (tab === id ? "text-[#FF2B2B]" : "text-neutral-600")}>{label}</span>
            </button>
          ))}
        </div>
      </nav>

      {/* Session keyboard tick bar */}
      {session && !session.done && !session.resting && sessFocus && (
        <div className="fixed inset-x-4 bottom-4 z-[70]">
          <button
            onPointerDown={(e) => {
              e.preventDefault();
              if (sessFocus === "w") document.getElementById("sess-r")?.focus();
              else { document.activeElement?.blur(); logSetAndContinue(); }
            }}
            className={cta + " w-full py-4 text-base shadow-2xl"}
          >
            {sessFocus === "w" ? "✓ Next — reps" : "✓ Log set →"}
          </button>
        </div>
      )}

      {renderSession()}
      {renderSettings()}
      {renderOnboarding()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MaxIntensityApp />);
} catch (e) { showErr(e.message); }
</script>
<script>
setTimeout(function(){ if (typeof Babel === "undefined") showErr("Babel failed to load - check connection"); }, 8000);
</script>
</body>
</html>
