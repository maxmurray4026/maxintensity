window.storage = {
  get: function(k){ return new Promise(function(res, rej){ var v=localStorage.getItem("mi:"+k); if(v===null){ rej(new Error("not found")); } else { res({key:k, value:v}); } }); },
  set: function(k,v){ return new Promise(function(res){ localStorage.setItem("mi:"+k, v); res({key:k, value:v}); }); },
  "delete": function(k){ return new Promise(function(res){ localStorage.removeItem("mi:"+k); res({key:k, deleted:true}); }); },

window.fetch = function(url, opts){
  opts = opts || {};
  if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {

    url = MI_SERVER;

    var code = localStorage.getItem("mi-code") || "";
    if (code) h["x-mi-code"] = code;
    delete h["x-api-key"];
    opts.headers = h;
  }
  return _fetch(url, opts);
};

// ---------- migrate old stored programs to current spec ----------
// Re-home logged sets when exercises move: match by name so history follows the exercise
function remapLogs(oldProg, newProg, logs) {
  try {
    if (!oldProg?.days || !newProg?.days || !logs) return logs;
    // location maps: name -> [ [d,i], ... ]
    const locs = (prog) => {
      const m = {};
      prog.days.forEach((d, di) => (d.exercises || []).forEach((e, ei) => {
        const n = (e.name || "").toLowerCase().trim();
        if (!m[n]) m[n] = [];
        m[n].push([di, ei]);
      }));
      return m;
    };
    const oldL = locs(oldProg), newL = locs(newProg);
    // if layouts already identical, skip
    const same = JSON.stringify(oldL) === JSON.stringify(newL);
    if (same) return logs;
    const out = {};
    const weeks = new Set();
    Object.keys(logs).forEach((k) => { const m = k.match(/^w(\d+)-d\d+$/); if (m) weeks.add(Number(m[1])); });
    weeks.forEach((w) => {
      const used = {}; // name -> count of new slots consumed
      oldProg.days.forEach((d, di) => (d.exercises || []).forEach((e, ei) => {
        const entry = logs[`w${w}-d${di}`]?.[ei];
        if (!entry) return;
        const n = (e.name || "").toLowerCase().trim();
        const targets = newL[n] || [];
        if (!targets.length) return; // exercise removed — drop its logs
        // prefer a target on the same day, else next unused occurrence
        const c = used[n] || 0;
        let t = targets.find(([td], x) => td === di && x >= c) || targets[Math.min(c, targets.length - 1)];
        used[n] = c + 1;
        const [nd, ni] = t;
        const nk = `w${w}-d${nd}`;
        if (!out[nk]) out[nk] = {};
        out[nk][ni] = entry;
      }));
    });
    // preserve any non-matching keys untouched (defensive)
    Object.keys(logs).forEach((k) => { if (!/^w\d+-d\d+$/.test(k) && !(k in out)) out[k] = logs[k]; });
    return out;
  } catch { return logs; }
}

function migrateProgram(p) {
  try {
    if (!p || !p.days) return p;
    p.days.forEach((d) => {
      d.exercises = (d.exercises || []).filter((e) => !/sissy/i.test(e.name || ""));
      const hasCross = d.exercises.some((e) => /cable crossover/i.test(e.name || ""));
      d.exercises = d.exercises.filter((e) => !(hasCross && /skull crusher/i.test(e.name || "")));
      d.exercises.forEach((e) => {
        e.tempo = "3-1-3-1";
        const n = e.name || "";
        if (/dumbbell rdl/i.test(n)) { e.name = "Barbell RDL"; }
        if (/skull crusher/i.test(n)) { e.name = "Tricep Cable Crossovers"; e.note = "on the stand"; }
        else if (/smith upper back row/i.test(n)) { e.name = "Smith Wide-Grip Row"; e.note = ""; }
        else if (/chest supported smith upper/i.test(n)) { e.name = "Chest Supported Smith Row"; }
        else if (/^dips/i.test(n)) { e.name = "Assisted Dips (machine)"; e.note = "use assistance — a strict 3-1-3-1 beats bodyweight bounce"; }
      });
    });
    p.days.forEach((d) => {
      if (d.exercises.some((e) => /rdl|romanian/i.test(e.name || ""))) {
        d.exercises = d.exercises.filter((e) => !/seated leg curl/i.test(e.name || ""));
      }
    });
    const allEx = p.days.flatMap((d) => d.exercises.map((e) => (e.name || "").toLowerCase()));
    const legDays = p.days.filter((d) => /leg/i.test(d.name || ""));
    if (legDays[0] && !allEx.some((n) => n.includes("rdl") || n.includes("romanian"))) {
      legDays[0].exercises.push({ name: "Barbell RDL", scheme: [10, 6, 6, 6], note: "hinge, flat back — hamstrings & lower back", tempo: "3-1-3-1", rest: "2–3 min" });
    }
    if (legDays[1] && !allEx.some((n) => n.includes("crunch"))) {
      legDays[1].exercises.push({ name: "Cable Crunch", scheme: [10, 6, 6, 6], note: "kneeling at the stand — core", tempo: "3-1-3-1", rest: "2–3 min" });
    }
  } catch {}
  return p;
}

// ---------- conservative starting-weight estimate (beginners) ----------
function suggestStart(name, bwKg, sex) {
  const n = (name || "").toLowerCase();
  const f = n.includes("leg press") ? 1.0
    : n.includes("hip thrust") || n.includes("glute") ? 0.6
    : n.includes("calf") ? 0.8
    : n.includes("extension") || n.includes("leg curl") || n.includes("adductor") ? 0.3
    : n.includes("row") || n.includes("pulldown") ? 0.3
    : n.includes("press") ? 0.25
    : n.includes("flye") || n.includes("lateral") ? 0.06
    : n.includes("curl") ? 0.1
    : n.includes("tricep") || n.includes("crossover") ? 0.1
    : 0;
  if (!f || !bwKg) return null;
  let v = bwKg * f * (sex === "Female" ? 0.65 : 1);
  v = Math.max(2.5, Math.round(v / 2.5) * 2.5);
  return v;
}

const ACTIVITY = [
  { label: "Sedentary", mult: 13.5 },
  { label: "Lightly active", mult: 15.5 },
  { label: "Fairly active", mult: 17.5 },
  { label: "Very active", mult: 20.5 },
];
const GOALS = [
  { label: "Lose weight", delta: -400 },
  { label: "Maintain", delta: 0 },
  { label: "Gain muscle", delta: 400 },
];
function calcTargets(kg, activityIdx, goalIdx) {
  const lbs = kg * 2.2046;
  const kcal = Math.round(lbs * ACTIVITY[activityIdx].mult + GOALS[goalIdx].delta);
  const protein = Math.round(lbs * 0.82);
  const fat = Math.round(lbs * 0.45);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { kcal, protein, carbs, fat };
}

// ---------- Split bias: reorder + reinforce priority muscles ----------
function applySplit(prog, split) {
  const pr = structuredClone(prog);
  // reset any previous bias: drop Glute Focus, restore canonical order (Upper first)
  pr.days = pr.days.filter((d) => d.name !== "Glute Focus");
  const canon = ["upper 1", "legs 1", "upper 2", "legs 2"];
  pr.days.sort((a, b) => {
    const ia = canon.indexOf((a.name || "").toLowerCase()), ib = canon.indexOf((b.name || "").toLowerCase());
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  const has = (exs, keys) => exs.some((e) => keys.some((k) => e.name.toLowerCase().includes(k)));
  const moveFirst = (exs, keys) => {
    const hit = [], rest = [];
    exs.forEach((e) => (keys.some((k) => e.name.toLowerCase().includes(k)) ? hit : rest).push(e));
    return [...hit, ...rest];
  };
  const mk = (name, note) => ({ name, scheme: [10, 6, 6, 6], note: note || "", tempo: "3-1-3-1", rest: "2\u20133 min" });
  const isUpper = (d) => d.name.toLowerCase().includes("upper");
  const isLegs = (d) => d.name.toLowerCase().includes("leg");

  if (split === "legglute") {
    pr.days.forEach((d) => {
      if (isLegs(d)) {
        if (!has(d.exercises, ["hip thrust", "glute"])) d.exercises.unshift(mk("Hip Thrust", "priority \u2014 drive through heels"));
        d.exercises = moveFirst(d.exercises, ["hip thrust", "glute", "leg press"]);
      }
    });
    const legs = pr.days.filter(isLegs), ups = pr.days.filter((d) => !isLegs(d) && d.name !== "Glute Focus");
    const glute = pr.days.find((d) => d.name === "Glute Focus");
    const inter = [];
    for (let i = 0; i < Math.max(legs.length, ups.length); i++) { if (legs[i]) inter.push(legs[i]); if (ups[i]) inter.push(ups[i]); }
    pr.days = inter;
    pr.days.push(glute || {
      name: "Glute Focus",
      exercises: [
        mk("Hip Thrust", "heavy — drive through heels"),
        mk("Leg Press", "feet high & wide — glute bias"),
        mk("Barbell RDL", "hinge, flat back — hamstrings & glutes"),
        mk("Adductor", ""),
        mk("Calf Press", ""),
      ],
    });
  } else if (split === "shoulder") {
    pr.days.forEach((d) => {
      if (isUpper(d)) {
        if (!has(d.exercises, ["lateral", "press behind", "shoulder press"])) d.exercises.unshift(mk("Cable Lateral Raise", "priority \u2014 strict, no swing"));
        d.exercises = moveFirst(d.exercises, ["lateral", "press behind", "shoulder press"]);
      }
    });
  } else if (split === "chest") {
    pr.days.forEach((d) => {
      if (isUpper(d)) {
        if (!has(d.exercises, ["incline dumbbell press", "clavicular", "flye", "dips"])) d.exercises.unshift(mk("Incline Dumbbell Press", "priority \u2014 full stretch"));
        d.exercises = moveFirst(d.exercises, ["incline dumbbell press", "press", "dips"]);
      }
    });
    const u1 = pr.days.find((d) => (d.name || "").toLowerCase() === "upper 1");
    if (u1) {
      const ci = u1.exercises.findIndex((e) => /clavicular/i.test(e.name || ""));
      const fly = ci !== -1 ? u1.exercises.splice(ci, 1)[0] : mk("Clavicular Cable Flye", "upper chest");
      u1.exercises.splice(Math.min(2, u1.exercises.length), 0, fly);
    }
  } else if (split === "arm") {
    pr.days.forEach((d) => {
      if (isUpper(d)) {
        if (!has(d.exercises, ["curl", "tricep"])) d.exercises.unshift(mk("Alternating DB Curls", "priority \u2014 no swing"));
        d.exercises = moveFirst(d.exercises, ["curl", "tricep", "dips"]);
      }
    });
  }
  pr.split = split;
  return pr;
}

// ---------- Muscle priorities: several body parts, in the order chosen ----------
// The first priority drives the split (unchanged applySplit above); every
// further priority is moved to the front of the sessions it belongs to, after
// the ones before it. Abs is special: a full 10-minute block goes FIRST on the
// two leg days, so the core gets the session's best energy without pushing the
// upper-body work sets down the order.
const ABS_BLOCK = [
  { name: "Cable Crunch", scheme: [10, 6, 6, 6], note: "abs block · kneeling at the stand, round the spine", tempo: "3-1-3-1", rest: "60 s" },
  { name: "Hanging Knee Raise", scheme: [10, 6, 6, 6], note: "abs block · knees to chest, no swing", tempo: "3-1-3-1", rest: "60 s" },
  { name: "Weighted Plank", scheme: [45, 45, 45, 45], note: "abs block · seconds, plate on the back — 10 min total", tempo: "hold", rest: "60 s" },
];
const PRIORITY_KEYS = {
  chest: ["incline dumbbell press", "bench", "clavicular", "flye", "fly", "chest press", "dips"],
  back: ["row", "pulldown", "pull-up", "chin"],
  shoulders: ["lateral", "press behind", "shoulder press", "overhead"],
  arms: ["curl", "tricep", "crossover", "dips"],
  legs: ["leg press", "extension", "leg curl", "squat", "calf"],
  glutes: ["hip thrust", "glute", "rdl", "abductor"],
  abs: ["crunch", "knee raise", "plank"],
};
const splitFor = (priorities) => {
  const f = (priorities || [])[0];
  return f === "legs" || f === "glutes" ? "legglute" : f === "shoulders" ? "shoulder" : f === "chest" ? "chest" : f === "arms" ? "arm" : "balanced";
};
function applyPriorities(prog, priorities) {
  const pri = (priorities || []).filter((k) => PRIORITY_KEYS[k]);
  let pr = applySplit(prog, splitFor(pri));
  // hits are ordered by the keyword list, so the muscle's main lift leads
  const moveFirst = (exs, keys) => {
    const hit = [], rest = [];
    exs.forEach((e) => { const n = (e.name || "").toLowerCase(); const ki = keys.findIndex((k) => n.includes(k)); (ki === -1 ? rest : hit).push(ki === -1 ? e : { e, ki }); });
    hit.sort((a, b) => a.ki - b.ki);
    return [...hit.map((h) => h.e), ...rest];
  };
  // strip any previous abs block so re-applying is idempotent
  pr.days.forEach((d) => { d.exercises = d.exercises.filter((e) => !/abs block/.test(e.note || "")); });
  // later priorities go first, so the first priority ends up in front
  [...pri].reverse().forEach((k) => {
    if (k === "abs") return;
    pr.days.forEach((d) => {
      const lower = /leg|glute/i.test(d.name || "");
      const belongs = (k === "legs" || k === "glutes") ? lower : !lower;
      if (belongs) d.exercises = moveFirst(d.exercises, PRIORITY_KEYS[k]);
    });
  });
  if (pri.includes("abs")) {
    pr.days.filter((d) => /^legs/i.test(d.name || "")).forEach((d) => {
      d.exercises = d.exercises.filter((e) => !/cable crunch/i.test(e.name || ""));
      d.exercises = [...ABS_BLOCK.map((e) => ({ ...e, scheme: [...e.scheme] })), ...d.exercises];
    });
  }
  pr.priorities = pri;
  return pr;
}

    ["Log", "Watch the block fill up", "Red days are trained days. Progress shows your strength line, your points, your streak — proof it's working."],

  ];
  const renderTutorial = () => {

          <p className={eyebrow}>{tag} · {tutStep + 1}/5</p>

  // ---- lock card ----
  const LockCard = ({ title, lines }) => (

          <p className={eyebrow}>Max AI</p>

  const renderSettings = () => {

              <button key={k} onClick={() => {

        <p className={eyebrow + " mt-6"}>Rank numbers</p>
        <div className={card + " mt-2 p-4"}>
          <p className="text-xs text-neutral-400">{rank ? rank.name + ", rank " + (rank.index + 1) + " of 7" + (rank.next ? " — " + rank.next.name + " takes " + rank.next.phrase : "") : "No rank yet."}</p>

        <p className={eyebrow + " mt-6"}>Apple Health</p>
        <div className={card + " mt-2 p-4"}>

          <div className="mt-2 grid grid-cols-3 gap-2">
            {[["steps", "Steps"], ["sleep", "Sleep h"], ["restingHr", "Rest HR"]].map(([k, ph]) => (
              <input key={k} inputMode="decimal" value={healthIn[k]} onChange={(e) => setHealthIn({ ...healthIn, [k]: e.target.value })} placeholder={ph} className="mono rounded-lg bg-neutral-900 px-2 py-2.5 text-right text-xs placeholder-neutral-600" />

          </div>
          <button onClick={() => { const d = todayKey(); setHealth((h) => ({ ...h, [d]: { ...(h[d] || {}), steps: Number(healthIn.steps) || undefined, sleep: Number(healthIn.sleep) || undefined, restingHr: Number(healthIn.restingHr) || undefined } })); setHealthIn({ steps: "", sleep: "", restingHr: "" }); }} className={ghost + " mt-2 w-full py-2.5 text-xs"}>Import today's numbers</button>
          {health[todayKey()] && <p className="mono mt-2 text-[10px] text-neutral-500">Today: {health[todayKey()].steps ? health[todayKey()].steps + " steps" : ""}{health[todayKey()].sleep ? " · " + health[todayKey()].sleep + "h sleep" : ""}{health[todayKey()].restingHr ? " · " + health[todayKey()].restingHr + " bpm resting" : ""}</p>}
          <p className="mono mt-2 text-[9px] text-neutral-600">iOS hook: window.MI_HEALTH.import(payload) — the native shell fills this automatically.</p>
        </div>
        <p className={eyebrow + " mt-6"}>How to edit your workout</p>
        <div className={card + " mt-2 p-4 text-sm leading-relaxed text-neutral-400"}>
          1. Train tab → tap <span className="text-neutral-200">Edit</span> above the list.<br />
          2. Rename, ↑↓ to reorder, Remove, or <span className="text-neutral-200">+ Add exercise</span>.<br />
          3. Tap <span className="text-neutral-200">Done</span> — it saves itself.
        </div>
        <p className={eyebrow + " mt-6"}>Max AI</p>
        <div className={card + " mt-2 p-4"}>
          {pro ? <p className="mono text-xs text-[#FF2B2B]">Unlocked — full access ✓</p>

              <div>

                <div className="mt-1.5 flex gap-2">
                  <input value={codeIn} onChange={(e) => setCodeIn(e.target.value)} placeholder="ACCESS CODE" className="mono flex-1 rounded-lg bg-neutral-900 px-3 py-2 text-sm uppercase placeholder-neutral-700" />
                  <button onClick={redeemCode} className={cta + " px-4 text-xs"}>Unlock</button>
                </div>
              </div>
            )
            : trialStart ? (
              <div>
                <p className="mono text-xs text-neutral-500">Trial ended. £30/mo or £240/yr — DM Max for your code.</p>

                  <input value={codeIn} onChange={(e) => setCodeIn(e.target.value)} placeholder="ACCESS CODE" className="mono flex-1 rounded-lg bg-neutral-900 px-3 py-2 text-sm uppercase placeholder-neutral-700" />

            <div>
              <textarea value={backupText} onChange={(e) => setBackupText(e.target.value)} rows={4} placeholder="Paste your backup text here" className="mono w-full rounded-lg bg-neutral-900 px-3 py-2 text-[10px] text-neutral-300 placeholder-neutral-600" />

                <button onClick={() => { try { navigator.clipboard.writeText(backupText); alert("Copied — save it somewhere safe."); } catch {} }} className="mono flex-1 rounded-lg border border-neutral-700 py-2 text-xs text-neutral-300">Copy</button>
                <button onClick={doImport} className={cta + " flex-1 py-2 text-xs"}>Restore this</button>

        <div className={card + " mt-2 p-3.5"}>

        </div>
        <button onClick={() => { setTutStep(0); setShowSettings(false); }} className="mono mt-5 w-full rounded-lg border border-neutral-800 py-3 text-xs text-neutral-400">Replay the tutorial</button>
        <button onClick={() => { setSettings((s) => ({ ...(s || {}), done: false })); setObStep(0); setShowSettings(false); }} className="mono mt-3 w-full rounded-lg border border-neutral-800 py-3 text-xs text-neutral-400">Re-run the setup questions</button>
        <p className="mono mt-5 text-center text-[9px] uppercase tracking-[0.25em] text-neutral-700">Max Intensity · V3</p>
      </div>

  // ---- guided session ----
  const renderSession = () => {
    if (!session) return null;
    if (session.done) {
      const items = day.exercises.map((exr, i) => ({ name: exr.name, sets: (((dayLogs[i] || {}).sets) || []).filter(Boolean).map((s) => ({ w: s.weight || "", r: s.reps || "", rir: s.rir })) }));
      const rirs = items.flatMap((it) => it.sets.map((s) => s.rir)).filter((r) => r !== undefined && r !== null);
      const worked = Array.from(new Set(day.exercises.flatMap((e) => MI.musclesFor(e.name))));
      return (
        <MI.Recap
          day={day.name} week={week + 1} plan={settings?.plan || "MAX INTENSITY"} items={items} prs={sessionPrs} pts={sessionPts}
          streak={game.streak} points={game.points} rank={rank ? rank.name : "Bronze"} unit={unit} wOut={wOut}
          worked={worked} priority={settings?.priorities || []} name={settings?.name || "Athlete"}
          avgRir={rirs.length ? rirs.reduce((a, b) => a + Number(b), 0) / rirs.length : null}
          onDone={endSession} onResume={resumeSession}
        />
      );
    }
    const exr = day.exercises[session.ex];
    const n = setsFor(exr);
    const label = isDeload ? `Set ${session.set + 1} ×6 easy` : SET_LABELS[session.set];
    const setLog = getSet(week, activeDay, session.ex, session.set);
    const prev = lastWeight(activeDay, session.ex, session.set);
    const isWork = !isDeload && session.set === 2;
    return (
      <div className="fixed inset-0 z-[60] flex flex-col bg-[#050505]" style={{ paddingTop: "env(safe-area-inset-top)" }}>
        {flashN > 0 && <div key={flashN} aria-hidden className="workflash pointer-events-none fixed inset-0 z-[64] bg-[#FF2B2B]" />}
        {prHit && (
          <button onClick={() => setPrHit(null)} className="fixed inset-0 z-[66] flex flex-col items-center justify-center overflow-hidden bg-[#050505] px-8 text-center">
            {Array.from({ length: 44 }).map((_, ci) => (
              <span
                key={ci}
                aria-hidden
                className="confetti absolute top-0"
                style={{
                  left: ((ci * 47) % 100) + "%",
                  background: ["#FF2B2B", "#F2EFE8", "#FFD24A", "#FF7A2B"][ci % 4],
                  width: 5 + ((ci * 13) % 6) + "px",
                  height: 9 + ((ci * 7) % 8) + "px",
                  animationDelay: ((ci * 83) % 1100) / 1000 + "s",
                  animationDuration: 2.1 + ((ci * 29) % 12) / 10 + "s",
                }}
              />
            ))}
            <p className={eyebrow}>All-time record</p>
            <p className="dp popin mt-2 text-[64px] uppercase leading-[0.9] text-[#FF2B2B]">New<br />best!</p>
            <p className="mono mt-4 text-3xl font-semibold text-[#F2EFE8]">{wOut(String(prHit.w))} {unit}</p>
            <p className="mono mt-1 text-xs uppercase tracking-widest text-neutral-400">{prHit.name}</p>
            <p className="mono mt-8 text-[10px] uppercase tracking-[0.25em] text-neutral-600">Tap to keep going</p>
          </button>

        <div className="px-5 pt-5">

            <button onClick={goBackSet} className="mono text-xs text-neutral-500" aria-label="Back one set">‹ Back</button>

          <div className="mt-3 flex gap-1">
            {day.exercises.map((e2, ei) =>
              Array.from({ length: setsFor(e2) }).map((_, si) => {
                const past = ei < session.ex || (ei === session.ex && si < session.set);
                const cur = ei === session.ex && si === session.set;
                return <div key={ei + "-" + si} className={"h-1 flex-1 rounded-full " + (cur ? "bg-[#FF2B2B]" : past ? "bg-neutral-500" : "bg-neutral-800")} />;
              })
            )}
          </div>
        </div>

        {session.resting ? (
          <div className="flex flex-1 flex-col items-center justify-center px-6 text-center">
            {rirAsk ? (
              <div className={card + " mb-6 w-full max-w-xs border-[#7f1d1d] p-4 text-left"}>
                <p className={eyebrow}>{rirAsk.set === 2 ? "How was the work set?" : "How's the weight feeling?"}</p>

                <div className="mt-3 grid grid-cols-4 gap-2">
                  {[0, 1, 2, 3].map((r) => (
                    <button key={r} onClick={() => answerRir(r)} className={"dp rounded-lg border py-3 text-lg " + (r === 1 ? "border-[#FF2B2B] bg-[#FF2B2B] text-white" : "border-neutral-700 bg-[#111] text-neutral-200")}>{r === 3 ? "3+" : r}</button>
                  ))}
                </div>
                <p className="mono mt-2 text-[9px] text-neutral-600">1 in reserve is the target. It tunes the next set; +2.5% next week still needs 6 clean reps.</p>
              </div>
            ) : rirNote ? (
              <p className="mono mb-4 max-w-xs text-xs text-[#F2EFE8]"><span className="text-[#FF2B2B]">Coach · </span>{rirNote.line}</p>
            ) : null}
            <p className="dp text-3xl uppercase tracking-widest text-[#FF2B2B]">Rest</p>
            <p className="mono mt-2 text-[84px] font-semibold leading-none text-[#F2EFE8]">
              {Math.floor(Math.max(0, restLeft ?? 0) / 60)}:{String(Math.max(0, restLeft ?? 0) % 60).padStart(2, "0")}
            </p>
            <p className="mt-4 text-sm text-neutral-500">Full recovery, full intensity. That's the trade.</p>
            <div className="mt-8 flex gap-3">
              <button onClick={() => setRestLeft((s) => (s === null ? null : s + 30))} className="mono rounded-lg border border-neutral-700 px-5 py-3 text-sm text-neutral-300">+30s</button>
              <button onClick={() => setRestLeft(null)} className={cta + " px-8 py-3 text-sm"}>Skip →</button>
            </div>
          </div>
        ) : (
          <div className="flex flex-1 flex-col px-6 pt-7">

            <p className="mt-2.5 text-[11px] text-neutral-600">{BREATH}</p>

            <div className="mt-7 grid grid-cols-2 gap-3">
              <div className={(isWork ? "rounded-xl bg-[#FF2B2B] " : card + " ") + "p-4"}>

                <input
                  id="sess-w"
                  inputMode="decimal"
                  enterKeyHint="next"
                  value={wOut(setLog.weight)}
                  onChange={(e) => setSet(activeDay, session.ex, session.set, "weight", wIn(e.target.value))}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("sess-r")?.focus(); } }}

                />

                {!prev && !setLog.weight && week === 0 && settings?.exp === "Just starting" && (() => {
                  const bwKg = Number(settings?.bw) ? (unit === "lb" ? Number(settings.bw) / 2.2046 : Number(settings.bw)) : 0;
                  const sug = suggestStart(exr.name, bwKg, settings?.sex);
                  return sug ? <p className={"mono mt-1 text-[10px] " + (isWork ? "text-red-100/80" : "text-neutral-600")}>new? try ~{wOut(String(sug))} {unit} — own the tempo</p> : null;
                })()}
              </div>
              <div className={(isWork ? "rounded-xl bg-[#FF2B2B] " : card + " ") + "p-4"}>
                <p className={"mono text-[10px] uppercase " + (isWork ? "text-red-100" : "text-neutral-500")}>Reps</p>
                <input
                  id="sess-r"
                  inputMode="numeric"
                  enterKeyHint="go"
                  value={setLog.reps || ""}
                  onChange={(e) => setSet(activeDay, session.ex, session.set, "reps", e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); logSetAndContinue(); } }}
                  onFocus={() => setSessFocus("r")}
                  onBlur={() => setTimeout(() => setSessFocus((f) => (f === "r" ? null : f)), 200)}
                  placeholder={isDeload ? "6" : String(exr.scheme[session.set])}
                  className={"mono mt-1 w-full bg-transparent text-4xl font-semibold focus:outline-none " + (isWork ? "text-white placeholder-red-200/60" : "text-[#F2EFE8] placeholder-neutral-700")}
                  aria-label="Reps"
                />
                {(() => {
                  const pr2 = getSet(week - 1, activeDay, session.ex, session.set);
                  return week > 0 && pr2.reps ? (
                    <p className={"mono mt-1 text-[10px] " + (isWork ? "text-red-100/80" : "text-neutral-600")}>last wk: {pr2.reps} reps — beat it</p>

        input:focus, button:focus-visible, select:focus-visible { outline: 2px solid #FF2B2B; outline-offset: 2px; }

      {/* Header */}

            {(() => {

              for (let i = 0; i <= dow; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; if (history[k]) cnt++; }
              const plan = settings?.daysPerWeek || 4;

                </p>
                <div className="mx-auto mt-4 flex max-w-xs flex-col gap-2">
                  {["I stalled on incline press — what now?", "Build me a bulking day of meals", "Why only this much volume?"].map((s) => (
                    <button key={s} onClick={() => setInput(s)} className={card + " px-3.5 py-2.5 text-left text-sm text-neutral-300"}>{s}</button>
                  ))}
                </div>
              </div>
            )}
            {chat.map((msg, i) => (
              <div key={i} className={"max-w-[85%] rounded-xl px-3.5 py-2.5 text-sm " + (msg.role === "user" ? "ml-auto bg-[#FF2B2B] text-white" : card + " text-neutral-200")}>
                {msg.content}
              </div>
            ))}
            {thinking && <div className={card + " mono w-fit px-3.5 py-2.5 text-xs text-neutral-500"}>coach is thinking…</div>}
            <div ref={chatEnd} />
          </div>
          <p className="mono px-4 pt-1 text-[9px] text-neutral-600">{aiLeft()} coach calls left today{settings?.induction ? " · reads your induction: " + ((settings.induction.obstacles || []).slice(0, 2).join(", ") || settings.induction.goalLine || "") : ""}</p>
          <div className="flex gap-2 p-3">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask your coach…" className="flex-1 rounded-lg border border-neutral-800 bg-[#141414] px-3.5 py-2.5 text-sm placeholder-neutral-600" />
            <button onClick={send} disabled={thinking} className={cta + " px-4 text-xs disabled:opacity-50"}>Send</button>
          </div>
        </main>
      )}

      {/* ---------- COMMUNITY ---------- */}
      {tab === "community" && (
        <MI.Community handle={handle} setHandle={(h) => { setHandle(h); setTimeout(() => submitBoard(true), 300); }} game={game} rank={rank ? rank.name : null}
          history={history} bestLift={bestLift()} boardCall={boardCall} wallCall={wallCall} unit={unit} wOut={wOut} prs={prs}
          projection={projectionNow()} planName={settings?.plan} adminCode={adminCode} setAdminCode={setAdminCode} checkins={checkins} beforePhoto={ob.beforePhoto} />
      )}

      {/* ---------- NEXT FIELD BAR ---------- */}
      {focusField && tab === "program" && !session && (
        <div className="fixed inset-x-3 bottom-20 z-50 flex gap-2">
          <button onPointerDown={(e) => { e.preventDefault(); focusNext(); }} className={cta + " flex-1 py-3 text-sm shadow-xl"}>✓ Next</button>
          <button onPointerDown={(e) => { e.preventDefault(); document.activeElement?.blur(); setFocusField(null); }} className="dp rounded-lg border border-neutral-700 bg-[#141414] px-4 text-xs uppercase text-neutral-300 shadow-xl">Done</button>
        </div>
      )}

      {/* ---------- REST TIMER BAR ---------- */}
      {restLeft !== null && !session && (
        <div className={"fixed inset-x-3 z-40 rounded-xl border border-[#7f1d1d] bg-[#141414]/95 p-3 shadow-xl " + (focusField && tab === "program" ? "bottom-36" : "bottom-20")}>
          <div className="flex items-center gap-3">
            <span className="dp text-[10px] uppercase tracking-widest text-[#FF2B2B]">Rest</span>
            <span className="mono text-2xl font-semibold text-neutral-100">
              {Math.floor(Math.max(0, restLeft) / 60)}:{String(Math.max(0, restLeft) % 60).padStart(2, "0")}
            </span>
            <div className="mx-1 h-1.5 flex-1 rounded-full bg-neutral-800">
              <div className="h-1.5 rounded-full bg-[#FF2B2B] transition-all" style={{ width: `${(Math.max(0, restLeft) / restTotal) * 100}%` }} />
            </div>
            <button onClick={() => setRestLeft((s) => (s === null ? null : s + 30))} className="mono rounded-md border border-neutral-700 px-2 py-1 text-xs text-neutral-300">+30</button>
            <button onClick={() => setRestLeft(null)} className="mono rounded-md border border-neutral-700 px-2 py-1 text-xs text-neutral-400">End</button>
          </div>
        </div>
      )}

      {/* ---------- BOTTOM NAV ---------- */}
      <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-neutral-800 bg-[#050505]/95 pb-[env(safe-area-inset-bottom)] backdrop-blur">
        <div className="flex">
          {NAV.map(([id, label, path]) => (
            <button key={id} onClick={() => setTab(id)} className="relative flex flex-1 flex-col items-center gap-0.5 py-2.5" aria-label={label}>
              {tab === id && <span className="absolute top-0 h-[2px] w-8 bg-[#FF2B2B]" />}
              <svg viewBox="0 0 24 24" className={"h-5 w-5 " + (tab === id ? "stroke-[#FF2B2B]" : "stroke-neutral-600")} fill="none" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d={path} />
              </svg>
              <span className={"dp text-[9px] uppercase tracking-wider " + (tab === id ? "text-[#FF2B2B]" : "text-neutral-600")}>{label}</span>
            </button>
          ))}
        </div>
      </nav>

      {/* Session keyboard tick bar */}
      {session && !session.done && !session.resting && sessFocus && (
        <div className="fixed inset-x-4 bottom-4 z-[70]">
          <button
            onPointerDown={(e) => {
              e.preventDefault();
              if (sessFocus === "w") document.getElementById("sess-r")?.focus();
              else { document.activeElement?.blur(); logSetAndContinue(); }
            }}
            className={cta + " w-full py-4 text-base shadow-2xl"}
          >
            {sessFocus === "w" ? "✓ Next — reps" : "✓ Log set →"}
          </button>
        </div>
      )}

      {renderSession()}

      {/* ---------- SHEETS ---------- */}
      <MI.Sheet open={shortSheet} onClose={() => setShortSheet(false)} title="Short on time">
        <p className="mt-1 text-xs text-neutral-500">Cuts warm-up sets and rests first, pairs a circuit under 40 minutes, keeps every work set. Volume goes, intensity stays.</p>
        <p className={MI.ui.label + " mt-4"}>How long have you got?</p>
        <div className="mt-2 grid grid-cols-4 gap-2">
          {[25, 30, 40, 45].map((m) => <button key={m} onClick={() => setShortMins(m)} className={"dp rounded-lg border py-3 text-lg " + (shortMins === m ? "border-[#FF2B2B] bg-[#FF2B2B] text-white" : "border-neutral-800 bg-[#111] text-neutral-300")}>{m}<span className="text-[10px]"> min</span></button>)}
        </div>
        <p className={MI.ui.label + " mt-4"}>What do you want to prioritise?</p>
        <div className="mt-2 flex flex-wrap gap-1.5">
          {[["", "Keep the order"], ...baseDay.exercises.map((e) => [e.name, e.name])].map(([v, l]) => (
            <button key={v || "keep"} onClick={() => setShortPri(v)} className={chip + " " + (shortPri === v ? "bg-[#FF2B2B] text-white" : "border border-neutral-800 text-neutral-400")}>{l}</button>
          ))}
        </div>
        <button onClick={runShortOnTime} className={cta + " mt-5 w-full py-4 text-base"}>Rebuild for {shortMins} minutes</button>
        {hasAI && <button onClick={() => { setShortSheet(false); runEditSession("I've only got " + shortMins + " minutes" + (shortPri ? ", prioritise " + shortPri : "")); }} className="mono mt-3 w-full py-2 text-xs text-neutral-500">Or let the coach rebuild it in plain language</button>}
      </MI.Sheet>

      <MI.Sheet open={!!swapSheet} onClose={() => setSwapSheet(null)} title="Recommended swaps">
        {swapSheet && (
          <>
            <p className="mt-1 text-xs text-neutral-500">For <span className="text-[#F2EFE8]">{(day.exercises[swapSheet.i] || {}).name}</span>. Same muscles, same method.{swapSheet.busy ? " Coach is thinking…" : swapSheet.source === "coach" ? "" : " Rule-based list" + (hasAI ? "" : " — the coach picks for your session on Max AI") + "."}</p>
            <div className="mt-3 space-y-2">
              {swapSheet.options.map((o, k) => (
                <button key={k} onClick={() => applySwap(swapSheet.i, o)} className={card + " block w-full p-4 text-left"}>
                  <p className="dp text-base uppercase tracking-wide text-neutral-100">{o.name}</p>
                  {o.note && <p className="mono mt-0.5 text-[10px] text-neutral-500">{o.note}</p>}
                  {o.why && <p className="mt-1 text-xs text-neutral-400">{o.why}</p>}
                </button>
              ))}
            </div>
            {swapSheet.err && <p className="mono mt-2 text-[10px] text-[#FF2B2B]">{swapSheet.err}</p>}
          </>
        )}
      </MI.Sheet>

      <MI.Sheet open={numsSheet} onClose={() => setNumsSheet(false)} title="Update my numbers">
        <p className="mt-1 text-xs text-neutral-500">Best single rep you're confident in, strict form. Your rank is recomputed from these.</p>
        <div className="mt-3 space-y-2">
          {(rank && rank.entries && rank.entries.length ? rank.entries.map((e) => e.key) : (settings?.knowsLiftNumbers === "bodyweight" ? ["pushups", "bwsquats", "pullups"] : ["bench", "squat", "ohp"])).map((k) => {
            const lift = window.MI_RANK ? (window.MI_RANK.LIFTS.find((l) => l.key === k) || window.MI_RANK.BODYWEIGHT.find((l) => l.key === k)) : null;
            const isLift = !!(window.MI_RANK && window.MI_RANK.LIFTS.find((l) => l.key === k));
            return (
              <div key={k} className="flex items-center gap-3">
                <p className="mono flex-1 text-xs text-neutral-300">{lift ? lift.label : k}</p>
                <input inputMode="decimal" value={numsIn[k] ?? ""} onChange={(e) => setNumsIn({ ...numsIn, [k]: e.target.value })} placeholder={isLift ? "kg" : "reps"} className="mono w-24 rounded-lg bg-neutral-900 px-3 py-2.5 text-right text-sm placeholder-neutral-700" />
              </div>
            );
          })}
        </div>
        <button onClick={updateRankNumbers} className={cta + " mt-4 w-full py-3.5 text-sm"}>Recompute my rank</button>
      </MI.Sheet>

      <MI.Sheet open={!!voiceTarget} onClose={() => { speech.stop(); setVoiceTarget(null); }} title={voiceTarget === "meal" ? "Say what you ate" : "Say the set"} z={78}>
        <p className="mt-1 text-xs text-neutral-500">{voiceTarget === "meal" ? '"Three eggs, two slices of sourdough and a banana."' : '"Incline press, 32s for six." Weight in ' + unit + ". Assumes the work set unless you say which."}</p>
        {speech.supported ? (
          <button onClick={() => (speech.listening ? speech.stop() : speech.start())} className={"mt-4 flex w-full items-center justify-center gap-2 rounded-lg border py-5 " + (speech.listening ? "border-[#FF2B2B] bg-[#1c0808] text-[#FF2B2B]" : "border-neutral-700 text-neutral-200")}>
            <MI.Ic d={MI.PATHS.MIC} className="h-6 w-6" /><span className="dp text-lg uppercase">{speech.listening ? "Listening… tap to stop" : "Tap and speak"}</span>
          </button>
        ) : <p className="mono mt-3 rounded-md bg-neutral-900 px-3 py-2 text-[11px] text-neutral-400">Voice isn't available in this browser. Type it below — same parsing.</p>}
        <textarea value={speech.transcript} onChange={(e) => speech.setTranscript(e.target.value)} rows={3} placeholder="Or type it here" className="mt-3 w-full rounded-lg bg-neutral-900 px-3 py-2.5 text-sm text-neutral-100 placeholder-neutral-600" />
        <button onClick={() => (voiceTarget === "meal" ? applyVoiceMeal(speech.transcript) : applyVoiceWorkout(speech.transcript))} disabled={voiceBusy || !speech.transcript.trim() || !hasAI} className={cta + " mt-3 w-full py-3.5 text-sm disabled:opacity-50"}>{voiceBusy ? "Working…" : hasAI ? "Log it" : "Max AI — start the trial"}</button>
        {voiceMsg && <p className="mono mt-2 text-[10px] text-neutral-400">{voiceMsg}</p>}
      </MI.Sheet>

      <MI.PhotoAssess open={showAssess} onClose={() => setShowAssess(false)} photo={checkins.length ? checkins[checkins.length - 1].data : ob.beforePhoto} hasAI={hasAI} tier={aiTier}
        ob={{ goal: settings?.goal, bwKg: Number(settings?.bw) ? (settings.unit === "lb" ? Number(settings.bw) / 2.2046 : Number(settings.bw)) : 0, sex: settings?.sex, exp: settings?.exp }}
        onApply={applyAssessment} onStartTrial={() => { setShowAssess(false); setShowPaywall(true); }}
        projection12={window.MI_PROJ ? window.MI_PROJ.projection12({ goal: settings?.goal, bwKg: Number(settings?.bw) || 0, exp: settings?.exp, knowsLiftNumbers: settings?.knowsLiftNumbers, strength: settings?.strength || {} }) : null} />

      {rankUp && <MI.RankUp from={rankUp.from} to={rankUp.to} onClose={() => setRankUp(null)} />}

      {renderSettings()}
      {renderTutorial()}
      {renderPaywall()}
      {renderOnboarding()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MaxIntensityApp />);
} catch (e) { showErr(e.message); }
</script>
<script>
setTimeout(function(){ if (typeof Babel === "undefined") showErr("Babel failed to load - check connection"); }, 8000);
</script>
</body>
</html>
